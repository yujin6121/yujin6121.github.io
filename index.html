<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 0초 후 지정된 URL로 리다이렉션 -->
    <meta http-equiv="refresh" content="0; url=http://theyujin.me/">
    <title>페이지 이동 중...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>잠시만 기다려 주세요</h1>
        <p><a href="http://theyujin.me/">theyujin.me</a>(으)로 이동 중입니다.</p>
        <p>자동으로 이동하지 않는다면 위 링크를 클릭해 주세요.</p>
    </div>

    <script>
        // JavaScript를 이용한 즉시 리다이렉션 (추가 안전장치)
        window.location.href = "http://theyujin.me/";
    </script>
</body>
</html>
